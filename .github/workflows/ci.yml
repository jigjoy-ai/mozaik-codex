name: ci

# Type check, tests, and that the bundle people install is the one this source builds: on every
# pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The committed bundle is what the source builds
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "::error::dist/ is not what the source builds: run npm run build and commit it"; exit 1; }
